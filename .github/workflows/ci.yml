name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the exact compiler; rustup honours it, so the
      # wasm hashed below is byte-identical to a local build.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - name: Install stellar-cli
        env:
          STELLAR_CLI_VERSION: 26.0.0
        run: |
          curl -sSfL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      # The hash printed here is what a reviewer compares against the contract
      # actually deployed.
      - run: |
          stellar contract build
          sha256sum target/wasm32v1-none/release/tally_links.wasm

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace tally-client
      - run: npm run lint
      - run: npm test
      - run: npm run build --workspace web
      # A payments front end should not ship known-vulnerable dependencies.
      - run: npm audit --audit-level=high
